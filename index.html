<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教會空間預約系統 Church Space Booking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink-navy:#1F2B45;
    --slate-blue:#4A5A78;
    --sanctuary-gold:#C9A227;
    --soft-ivory:#FAF7F0;
    --ember:#B85C38;
    --forest:#2F4A3C;
    --line:#E3DDCC;
    --card-bg:#FFFFFF;
    --room-fill:#FFFDF9;
    --room-fill-hover:#F3EEE0;
    --room-fill-active:#1F2B45;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--soft-ivory);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink-navy);
    min-height:100vh;
  }
  .app{max-width:1080px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  .header{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:22px;margin-bottom:26px;
    border-bottom:1px solid var(--line);
    gap:12px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand-mark{width:64px;height:auto;position:relative;flex:none;}
  .brand-mark img{width:100%;height:auto;display:block;}
  .brand h1{font-family:'Noto Serif TC', serif;font-size:22px;font-weight:700;margin:0;letter-spacing:.02em;}
  .brand p{margin:2px 0 0;font-size:12.5px;color:var(--slate-blue);}
  .user-chip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--slate-blue);}
  .user-chip .dot{
    width:32px;height:32px;border-radius:50%;background:var(--ink-navy);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:'Noto Serif TC',serif;
  }
  .signout{border:1px solid var(--line);background:#fff;color:var(--slate-blue);font-size:13.5px;padding:8px 14px;border-radius:20px;cursor:pointer;}
  .signout:hover{border-color:var(--slate-blue);}

  /* Login screen */
  .login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;}
  .login-card{
    background:var(--card-bg);border:1px solid var(--line);border-radius:8px 8px 60px 60px;
    padding:44px 40px 40px;max-width:380px;width:100%;text-align:center;
    box-shadow:0 24px 48px -32px rgba(31,43,69,.35);position:relative;
  }
  .login-card::before{
    content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:60%;height:4px;
    background:linear-gradient(90deg,var(--sanctuary-gold),var(--ember));border-radius:0 0 6px 6px;
  }
  .login-card .arch{width:150px;height:auto;margin:0 auto 18px;}
  .login-card .arch img{width:100%;height:auto;display:block;}
  .login-card h2{font-family:'Noto Serif TC',serif;font-size:21px;margin:0 0 8px;line-height:1.35;}
  .login-card .sub{font-size:14.5px;color:var(--slate-blue);margin:0 0 26px;line-height:1.6;}
  .field{text-align:left;margin-bottom:14px;}
  .field label{display:block;font-size:13.5px;color:var(--slate-blue);margin-bottom:6px;font-weight:600;}
  .field input{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink-navy);}
  .field input:focus{outline:2px solid var(--sanctuary-gold);outline-offset:1px;border-color:transparent;}
  .field .hint{font-size:12.5px;color:#9a9280;margin-top:5px;line-height:1.5;}
  .g-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--ink-navy);color:#fff;
    border:none;border-radius:6px;padding:12px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:'Noto Sans TC',sans-serif;margin-top:8px;
  }
  .g-btn:hover{background:#2c3a5c;}
  .g-btn svg{width:18px;height:18px;flex:none;}
  .err{color:var(--ember);font-size:14px;margin-top:10px;min-height:16px;line-height:1.5;}
  .footnote{font-size:12.5px;color:#a39a86;margin-top:22px;line-height:1.6;}
  .public-view-link{
    display:block;width:100%;box-sizing:border-box;text-align:center;background:none;
    border:1px solid var(--line);color:var(--slate-blue);border-radius:6px;padding:11px;
    font-size:13.5px;cursor:pointer;margin-top:12px;text-decoration:none;font-weight:600;
  }
  .public-view-link:hover{border-color:var(--sanctuary-gold);color:var(--ink-navy);}

  /* Layout grid */
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;}
  @media (max-width:860px){.grid{grid-template-columns:1fr;}}

  .panel{background:var(--card-bg);border:1px solid var(--line);border-radius:10px;padding:22px 22px 24px;}
  .panel h2{font-family:'Noto Serif TC',serif;font-size:18.5px;margin:0 0 6px;line-height:1.4;}
  .panel .desc{font-size:14px;color:var(--slate-blue);margin:0 0 16px;line-height:1.5;}

  /* Floor tabs */
  .floor-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .floor-tab{
    border:1px solid var(--line);background:#fff;color:var(--slate-blue);font-size:14px;font-weight:600;
    padding:9px 16px;border-radius:20px;cursor:pointer;
  }
  .floor-tab.active{background:var(--ink-navy);color:#fff;border-color:var(--ink-navy);}

  /* Map */
  .map-wrap{
    border:1px solid var(--line);border-radius:8px;background:#FBF8F1;padding:10px;margin-bottom:8px;
    overflow-x:auto;-webkit-overflow-scrolling:touch;
  }
  .map-wrap svg{width:100%;min-width:480px;height:auto;display:block;}
  .room-shape{fill:var(--room-fill);stroke:var(--line);stroke-width:1.5;cursor:pointer;transition:fill .15s, stroke .15s;}
  .room-shape:hover{fill:var(--room-fill-hover);stroke:var(--sanctuary-gold);}
  .room-shape.active{fill:var(--room-fill-active);stroke:var(--sanctuary-gold);}
  .room-shape.locked{fill:#EDEAE0;stroke:var(--line);cursor:not-allowed;opacity:0.65;}
  .room-shape.locked:hover{fill:#EDEAE0;stroke:var(--line);}
  .room-label{font-family:'Noto Sans TC',sans-serif;font-size:13.5px;fill:var(--ink-navy);pointer-events:none;text-anchor:middle;}
  .room-label.sub{font-size:11px;fill:var(--slate-blue);}
  .room-shape.active + .room-label,
  .room-label.active{fill:#fff;}
  .map-hint{font-size:13px;color:#a39a86;margin:0 0 18px;line-height:1.5;}
  .selected-room-line{
    display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px;
    background:#F3EEE0;border-radius:6px;padding:9px 12px;
  }
  .selected-room-line b{font-family:'Noto Serif TC',serif;color:var(--ink-navy);}

  /* Form */
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field textarea{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:16px;resize:vertical;min-height:80px;color:var(--ink-navy);}
  .field textarea:focus{outline:2px solid var(--sanctuary-gold);outline-offset:1px;}
  .field select{width:100%;padding:12px 12px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:16px;background:#fff;color:var(--ink-navy);}
  .field select:focus{outline:2px solid var(--sanctuary-gold);outline-offset:1px;}
  .submit-btn{background:var(--forest);color:#fff;border:none;border-radius:6px;padding:13px 18px;font-size:15.5px;font-weight:600;cursor:pointer;margin-top:6px;}
  .submit-btn:hover{background:#26392e;}
  .submit-btn:disabled{background:#B8C0B9;cursor:not-allowed;}
  .form-msg{font-size:14px;margin-top:10px;min-height:16px;line-height:1.5;}
  .form-msg.ok{color:var(--forest);}
  .form-msg.bad{color:var(--ember);}

  /* Bookings list */
  .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-chip{border:1px solid var(--line);background:#fff;color:var(--slate-blue);font-size:13.5px;padding:7px 14px;border-radius:20px;cursor:pointer;}
  .filter-chip.active{background:var(--ink-navy);color:#fff;border-color:var(--ink-navy);}
  .booking-item{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
  .booking-item:last-child{border-bottom:none;}
  .b-date{flex:none;width:56px;text-align:center;}
  .b-date .d{font-size:19px;font-weight:700;font-family:'Noto Serif TC',serif;color:var(--ink-navy);line-height:1.1;}
  .b-date .m{font-size:12.5px;color:var(--slate-blue);}
  .b-body{flex:1;}
  .b-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .b-room{font-size:15px;font-weight:600;}
  .b-time{font-size:13.5px;color:var(--slate-blue);}
  .b-who{font-size:14px;color:var(--slate-blue);margin-top:3px;}
  .b-purpose{font-size:14.5px;margin-top:5px;color:var(--ink-navy);line-height:1.5;}
  .b-cancel{font-size:13.5px;color:var(--ember);background:none;border:none;cursor:pointer;padding:6px 0;text-decoration:underline;flex:none;}
  .empty{text-align:center;color:#a39a86;font-size:14px;padding:30px 0;}
  .loading{text-align:center;color:#a39a86;font-size:14px;padding:30px 0;}
  .fallback-banner{
    background:#FBF0E4;border:1px solid var(--ember);color:#8a4126;
    font-size:13.5px;padding:11px 14px;border-radius:6px;margin-bottom:18px;line-height:1.6;
  }

  /* View switch */
  .view-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .view-tab{
    border:1px solid var(--line);background:#fff;color:var(--slate-blue);font-size:14.5px;font-weight:600;
    padding:11px 18px;border-radius:8px;cursor:pointer;
  }
  .view-tab.active{background:var(--ink-navy);color:#fff;border-color:var(--ink-navy);}

  /* Calendar */
  .cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-nav{display:flex;align-items:center;gap:8px;}
  .cal-nav button{
    border:1px solid var(--line);background:#fff;color:var(--ink-navy);border-radius:6px;
    width:38px;height:38px;cursor:pointer;font-size:16px;
  }
  .cal-nav button:hover{border-color:var(--sanctuary-gold);}
  .cal-range{font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;min-width:150px;text-align:center;}
  .cal-today-btn{border:1px solid var(--line);background:#fff;color:var(--slate-blue);font-size:13.5px;padding:8px 14px;border-radius:20px;cursor:pointer;}
  .cal-room-select{border:1px solid var(--line);background:#fff;color:var(--ink-navy);font-size:14px;padding:8px 10px;border-radius:6px;font-family:inherit;}

  .cal-scroll{max-height:520px;overflow-y:auto;overflow-x:auto;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch;}
  .cal-grid{display:grid;grid-template-columns:48px repeat(7,1fr);min-width:640px;}
  .cal-head-row{display:contents;}
  .cal-corner{position:sticky;top:0;left:0;background:#fff;z-index:3;border-bottom:1px solid var(--line);}
  .cal-head-cell{
    position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid var(--line);border-left:1px solid var(--line);
    text-align:center;padding:8px 2px;font-size:12px;color:var(--slate-blue);
  }
  .cal-head-cell .dow{font-weight:700;color:var(--ink-navy);font-size:13.5px;}
  .cal-head-cell.today{background:#F3EEE0;}
  .cal-time-col{position:relative;border-right:1px solid var(--line);}
  .cal-time-label{
    position:absolute;right:4px;transform:translateY(-6px);font-size:11px;color:#a39a86;
  }
  .cal-day-col{
    position:relative;border-left:1px solid var(--line);
    background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent 44px);
  }
  .cal-day-col.today{background-color:#FBF8F1;}
  .cal-event{
    position:absolute;border-radius:4px;overflow:hidden;padding:2px 5px;font-size:11.5px;line-height:1.3;
    color:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.25);
  }
  .cal-event b{display:block;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .cal-legend-item{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--slate-blue);}
  .cal-legend-dot{width:9px;height:9px;border-radius:2px;flex:none;}
  .cal-detail{
    margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#FBF8F1;
  }
  .cal-detail .close-x{float:right;background:none;border:none;color:var(--slate-blue);cursor:pointer;font-size:14.5px;padding:4px;}

  /* Month view — styled to resemble Google Calendar's month grid */
  .cal-mode-tabs{display:flex;gap:6px;}
  .cal-mode-tab{
    border:1px solid var(--line);background:#fff;color:var(--slate-blue);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:20px;cursor:pointer;
  }
  .cal-mode-tab.active{background:var(--ink-navy);color:#fff;border-color:var(--ink-navy);}
  .month-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px;}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);min-width:560px;background:var(--line);gap:1px;border-top:1px solid var(--line);}
  .month-head-cell{
    background:#fff;text-align:center;padding:10px 2px;font-size:11px;font-weight:600;color:var(--slate-blue);
    letter-spacing:.03em;text-transform:uppercase;
  }
  .month-day-cell{
    min-height:96px;padding:6px 6px 4px;background:#fff;position:relative;
  }
  .month-day-cell.other-month{background:#fff;}
  .month-day-cell.other-month .month-day-num{color:#c9c2ae;}
  .month-day-num{
    font-size:13px;font-weight:400;display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;cursor:pointer;border-radius:50%;color:var(--ink-navy);margin-bottom:2px;
  }
  .month-day-num:hover{background:#F3EEE0;}
  .month-day-cell.today .month-day-num{background:var(--ink-navy);color:#fff;font-weight:600;}
  .month-event-row{
    display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-navy);cursor:pointer;
    padding:2px 3px;border-radius:4px;margin-bottom:1px;white-space:nowrap;overflow:hidden;
  }
  .month-event-row:hover{background:#F3EEE0;}
  .month-event-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .month-event-time{color:var(--slate-blue);flex:none;}
  .month-event-title{overflow:hidden;text-overflow:ellipsis;font-weight:500;}
  .month-more-link{font-size:11px;color:var(--slate-blue);cursor:pointer;margin-top:2px;display:block;padding:2px 3px;}
  .month-more-link:hover{color:var(--ink-navy);text-decoration:underline;}
  .admin-badge{
    display:inline-block;background:var(--sanctuary-gold);color:var(--ink-navy);font-size:11.5px;font-weight:700;
    padding:2px 8px;border-radius:10px;vertical-align:middle;margin-left:4px;
  }
  .edit-form{width:100%;}
  .cancel-edit-btn{
    font-size:14px;color:var(--slate-blue);background:none;border:1px solid var(--line);border-radius:6px;
    padding:11px 16px;cursor:pointer;margin-top:0;
  }
  .recurring-form{width:100%;}
  .dow-checks{display:flex;flex-wrap:wrap;gap:10px;}
  .dow-check{
    display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-navy);font-weight:400;
    border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer;background:#fff;
  }
  .dow-check input{margin:0;}
  .recurring-toggle-btn{
    border:1px solid var(--sanctuary-gold);background:#FBF3DE;color:var(--ink-navy);font-size:14px;font-weight:600;
    padding:11px 16px;border-radius:6px;cursor:pointer;margin-bottom:16px;display:inline-flex;align-items:center;gap:6px;
  }
  .recurring-badge{
    display:inline-block;font-size:11.5px;color:var(--slate-blue);border:1px solid var(--line);border-radius:10px;
    padding:2px 8px;margin-left:6px;vertical-align:middle;
  }
  .pending-badge{
    display:inline-block;font-size:11.5px;color:#8a4126;background:#FBF0E4;border:1px solid var(--ember);border-radius:10px;
    padding:2px 8px;margin-left:6px;vertical-align:middle;font-weight:600;
  }

  /* ===== Mobile-friendly components (used only when isMobile() is true) ===== */
  .grid > *{min-width:0;}
  .room-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .room-btn{
    border:1.5px solid var(--line);background:#fff;color:var(--ink-navy);border-radius:10px;
    padding:14px 10px;min-height:64px;font-size:15.5px;font-weight:600;cursor:pointer;text-align:center;
    font-family:'Noto Sans TC',sans-serif;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .room-btn small{font-size:12.5px;font-weight:400;color:var(--slate-blue);}
  .room-btn.active{background:var(--ink-navy);color:#fff;border-color:var(--sanctuary-gold);}
  .room-btn.active small{color:#E9E2CF;}
  .room-btn.locked{background:#EDEAE0;color:#8d8778;border-style:dashed;}
  .room-btn.locked small{color:#8d8778;}
  .filter-select{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fff;
    color:var(--ink-navy);font-family:inherit;margin-bottom:14px;
  }
  .m-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .m-cal-head{text-align:center;font-size:12px;font-weight:700;color:var(--slate-blue);padding:8px 0;background:#FBF8F1;border-bottom:1px solid var(--line);}
  .m-cal-day{
    min-height:52px;padding:5px 2px;text-align:center;cursor:pointer;border-top:1px solid #F1ECDF;
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .m-cal-day .num{
    font-size:15px;width:30px;height:30px;line-height:30px;border-radius:50%;color:var(--ink-navy);
  }
  .m-cal-day.other-month .num{color:#c9c2ae;}
  .m-cal-day.today .num{background:var(--ink-navy);color:#fff;font-weight:700;}
  .m-cal-day.picked{background:#F3EEE0;}
  .m-cal-day.picked .num{outline:2px solid var(--sanctuary-gold);}
  .m-dots{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;max-width:36px;}
  .m-dots span{width:7px;height:7px;border-radius:50%;}
  .m-dots .more{width:auto;height:auto;font-size:10px;color:var(--slate-blue);line-height:7px;}
  .agenda-day{margin-top:16px;}
  .agenda-day-title{
    font-family:'Noto Serif TC',serif;font-size:16px;font-weight:700;padding:8px 2px;border-bottom:2px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .agenda-day-title.today{border-bottom-color:var(--sanctuary-gold);}
  .agenda-day-title small{font-family:'Noto Sans TC',sans-serif;font-size:12.5px;font-weight:600;color:var(--sanctuary-gold);}
  .agenda-empty{font-size:14px;color:#a39a86;padding:10px 2px;}
  .agenda-item{
    display:flex;gap:12px;align-items:stretch;padding:12px 4px;border-bottom:1px solid #F1ECDF;cursor:pointer;
  }
  .agenda-bar{width:5px;border-radius:3px;flex:none;}
  .agenda-time{flex:none;width:78px;font-size:14px;font-weight:600;color:var(--ink-navy);line-height:1.4;}
  .agenda-time span{display:block;font-weight:400;color:var(--slate-blue);font-size:13px;}
  .agenda-main{flex:1;min-width:0;}
  .agenda-room{font-size:16px;font-weight:700;color:var(--ink-navy);}
  .agenda-sub{font-size:14px;color:var(--slate-blue);margin-top:3px;line-height:1.45;overflow-wrap:anywhere;}
  .sheet-backdrop{position:fixed;inset:0;background:rgba(31,43,69,.35);z-index:40;}

  /* 教會活動(來自 WCEC App 行事曆) */
  .church-chip{font-size:11px;font-weight:600;color:#6B4A12;background:#F6EBD2;border-left:3px solid #B8862F;border-radius:4px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;}
  .cal-head-cell .church-chip{margin-top:4px;text-align:left;text-transform:none;letter-spacing:0;}
  .church-agenda{display:flex;gap:12px;align-items:center;padding:10px;margin:8px 0 4px;background:#F6EBD2;border-left:5px solid #B8862F;border-radius:6px;}
  .church-agenda-tag{flex:none;width:78px;font-size:13px;font-weight:700;color:#6B4A12;line-height:1.3;}
  .church-agenda-tag span{display:block;font-weight:500;font-size:11.5px;}
  .church-agenda-main{flex:1;min-width:0;font-size:14px;color:#5a4417;line-height:1.45;overflow-wrap:anywhere;}
  .church-agenda-main b{font-size:16px;color:#3f2f0d;display:block;}
  .m-dots .church-dot{background:#B8862F;border-radius:1px;transform:rotate(45deg);}
  @media (max-width:640px){
    .app{padding:14px 12px 60px;}
    .header{padding-bottom:12px;margin-bottom:14px;gap:10px;}
    .brand{gap:10px;min-width:0;}
    .brand-mark{width:44px;}
    .brand h1{font-size:17px;line-height:1.3;}
    .brand p{display:none;}
    .user-chip{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;}
    .user-chip > div:nth-child(2){flex:1;min-width:0;}
    .user-chip > div:nth-child(2) > div:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .signout{flex:none;padding:9px 12px;}
    .view-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
    .view-tab{padding:13px 6px;font-size:15px;text-align:center;}
    .panel{padding:16px 14px 18px;border-radius:12px;}
    .panel h2{font-size:18px;}
    .panel .desc{font-size:14px;margin-bottom:12px;}
    .grid{gap:14px;}
    .floor-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .floor-tab{padding:11px 4px;font-size:14px;border-radius:8px;text-align:center;}
    .selected-room-line{font-size:15px;padding:12px;}
    .field label{font-size:14.5px;}
    .field input, .field select, .field textarea{min-height:48px;font-size:16px;}
    .field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;}
    .form-row{gap:10px;}
    .form-row > *{min-width:0;}
    .submit-btn{width:100%;padding:15px;font-size:16px;border-radius:8px;}
    .recurring-toggle-btn{width:100%;justify-content:center;}
    .booking-item{gap:10px;padding:14px 2px;}
    .b-date{width:46px;}
    .b-date .d{font-size:21px;}
    .b-body{min-width:0;}
    .b-top{flex-direction:column;align-items:flex-start;gap:3px;}
    .b-room{font-size:16px;}
    .b-time{font-size:14.5px;font-weight:600;color:var(--ink-navy);white-space:nowrap;}
    .recurring-badge, .pending-badge{margin:5px 6px 0 0;}
    .b-room{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px;}
    .b-room .recurring-badge, .b-room .pending-badge{margin-left:0;}
    .b-purpose{overflow-wrap:anywhere;}
    .b-cancel{
      text-decoration:none;border:1px solid var(--line);border-radius:8px;background:#fff;
      padding:9px 12px;font-size:14px;
    }
    .cal-toolbar{flex-direction:column;align-items:stretch;gap:10px;}
    .cal-nav{justify-content:space-between;}
    .cal-nav button{width:44px;height:44px;font-size:20px;}
    .cal-range{min-width:0;flex:1;font-size:16px;}
    .cal-today-btn{height:44px;padding:0 12px !important;width:auto !important;font-size:13.5px !important;border-radius:22px !important;}
    .cal-mode-tabs{display:grid;grid-template-columns:1fr 1fr;}
    .cal-mode-tab{padding:11px;font-size:14.5px;border-radius:8px;}
    .cal-room-select{width:100%;font-size:16px;padding:12px;min-height:48px;margin-bottom:12px;}
    .cal-detail{
      position:fixed;left:0;right:0;bottom:0;margin:0;z-index:50;max-height:78vh;overflow-y:auto;
      border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));background:#fff;
      box-shadow:0 -12px 32px rgba(31,43,69,.25);
    }
    .cal-detail .close-x{font-size:15px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;}
    .login-card{padding:32px 22px 28px;}
  }
</style>

const GAS_CONFIGURED =

/* Sends a notification via the Google Apps Script webhook. */
async function deliverNotification(params){
  if(!GAS_CONFIGURED) return;
  try{
    await fetch(GAS_EMAIL_WEBHOOK_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(params)
    });
  }catch(e){
    // Don't block the UI just because the email failed to send.
  }
}

async function sendBookingNotification(record){
  if(!GAS_CONFIGURED) return;

function quarterHourOptions(){

  for(let h=6; h<24; h++){
    for(const m of [0,15,30,45]){
      opts.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));

}

/* Converts a 24-hour "HH:MM" string to a 12-hour "h:MM AM/PM" display string.
   Internal storage/comparison always stays in 24-hour format — only display changes. */
function to12h(hhmm){
  if(!hhmm) return hhmm;
  const [h,m] = hhmm.split(':').map(Number);
  const period = h < 12 ? 'AM' : 'PM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return h12 + ':' + String(m).padStart(2,'0') + ' ' + period;
}
function hourLabel12(h){
  const period = h < 12 ? 'AM' : 'PM';
  let h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return h12 + ' ' + period;
}

const ROOM_COLORS = ['#1F2B45','#4A5A78','#C9A227','#B85C38','#2F4A3C','#7A6248','#6B4E71','#3E6E75','#8C5B3F','#5C6B3F','#4B3F72','#8A3B4B','#2E5C6E','#7A3E2E','#456B4A','#5A4A6B'];
function colorForRoom(room){
  const idx = ROOMS.indexOf(room);
  return ROOM_COLORS[idx >= 0 ? idx % ROOM_COLORS.length : 0];
}

function pad2(n){ return String(n).padStart(2,'0'); }
function formatISODate(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function parseISODate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function mondayOf(d){
  const day = d.getDay(); // 0=Sun..6=Sat
  const diff = (day === 0 ? -6 : 1 - day);
  const m = new Date(d);
  m.setDate(m.getDate() + diff);
  return m;
}
function weekDates(startISO){
  const start = parseISODate(startISO);
  const out = [];
  for(let i=0;i<7;i++){
    const d = new Date(start);
    d.setDate(d.getDate()+i);
    out.push(formatISODate(d));
  }
  return out;
}
/* Generates every date between startISO and endISO (inclusive) that falls on
   one of the given days of week (0=Sun..6=Sat). Capped at 104 occurrences
   (~2 years weekly) as a sanity limit. */
function recurringDates(startISO, endISO, daysOfWeek){
  const start = parseISODate(startISO);
  const end = parseISODate(endISO);
  const out = [];
  const d = new Date(start);
  while(d <= end && out.length <= 104){
    if(daysOfWeek.includes(d.getDay())) out.push(formatISODate(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function toMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
/* Assigns a horizontal "lane" to each event so overlapping events in the
   same day sit side-by-side instead of on top of each other. */
function assignLanes(events){
  const sorted = [...events].sort((a,b) => toMinutes(a.start) - toMinutes(b.start));
  const laneEnds = [];
  const withLanes = sorted.map(ev => {
    const startMin = toMinutes(ev.start);
    let lane = laneEnds.findIndex(end => end <= startMin);
    if(lane === -1){ lane = laneEnds.length; laneEnds.push(0); }
    laneEnds[lane] = toMinutes(ev.end);
    return {...ev, lane};
  });
  const maxLanes = laneEnds.length || 1;
  return {events: withLanes, maxLanes};
}

function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,1);
  return parts[0].slice(0,1) + parts[parts.length-1].slice(0,1);
}

/* Build an octagon point-string that fits inside x,y,w,h with corner cut size `cut` */
function octagonPoints(x,y,w,h,cut){
  const pts = [
    [x+cut, y], [x+w-cut, y],
    [x+w, y+cut], [x+w, y+h-cut],
    [x+w-cut, y+h], [x+cut, y+h],
    [x, y+h-cut], [x, y+cut]
  ];
  return pts.map(p => p.join(',')).join(' ');
}

/* ---------- Resilient storage layer ---------- */
/* Falls back to an in-memory store (this browser tab only) if the real
   persistent storage isn't available, so the app never hard-fails. */
const _memoryStore = new Map();

const storageAdapter = {
  async get(key, shared){
    try{
      if(window.storage) return await window.storage.get(key, shared);
      throw new Error('no window.storage');
    }catch(e){
      state.usingFallbackStorage = true;
      const k = (shared?'s:':'l:')+key;
      if(_memoryStore.has(k)) return {key, value:_memoryStore.get(k), shared};
      return null;
    }
  },
  async set(key, value, shared){
    try{
      if(window.storage){
        const res = await window.storage.set(key, value, shared);
        if(res) return res;
        throw new Error('set returned falsy');
      }
      throw new Error('no window.storage');
    }catch(e){
      state.usingFallbackStorage = true;
      const k = (shared?'s:':'l:')+key;
      _memoryStore.set(k, value);
      return {key, value, shared};
    }
  },
  async delete(key, shared){
    try{
      if(window.storage) return await window.storage.delete(key, shared);
      throw new Error('no window.storage');
    }catch(e){
      state.usingFallbackStorage = true;
      const k = (shared?'s:':'l:')+key;
      _memoryStore.delete(k);
      return {key, deleted:true, shared};
    }
  },
  async list(prefix, shared){
    try{
      if(window.storage) return await window.storage.list(prefix, shared);
      throw new Error('no window.storage');
    }catch(e){
      state.usingFallbackStorage = true;
      const p = (shared?'s:':'l:')+(prefix||'');
      const stripLen = (shared?'s:':'l:').length;
      const keys = [];
      for(const k of _memoryStore.keys()){
        if(k.startsWith(p)) keys.push(k.slice(stripLen));
      }
      return {keys, prefix, shared};
    }
  }
};

/* ══ 教會行事曆 Church events ══════════════════════════════════════════
   和 WCEC App 同一份資料(試算表「行事曆」→ Firebase),每次開啟頁面時讀取。
   只是「顯示」在預約行事曆上,讓大家預約前知道那天有教會活動;
   不會佔用或鎖住任何空間,也不會出現在「我的預約」或審核清單裡。 */
const CHURCH_EVENTS_URL = 'https://firestore.googleapis.com/v1/projects/wcec-church-app/databases/(default)/documents/events?pageSize=500';
function escHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function loadChurchEvents(){
  try{
    const res = await fetch(CHURCH_EVENTS_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    state.churchEvents = (j.documents || []).map(d => {
      const f = d.fields || {};
      const s = f.startTime && f.startTime.timestampValue ? new Date(f.startTime.timestampValue) : null;
      if(!s) return null;
      const e = f.endTime && f.endTime.timestampValue ? new Date(f.endTime.timestampValue) : s;
      return {
        title: (f.title || {}).stringValue || '',
        location: (f.location || {}).stringValue || '',
        allDay: !!(f.allDay || {}).booleanValue,
        start: s, end: e
      };
    }).filter(Boolean).sort((a,b) => a.start - b.start);
  }catch(e){
    console.warn('Church events not loaded:', e);
    state.churchEvents = [];
  }
}
function churchEventsOn(dateISO){
  const day = parseISODate(dateISO);
  const next = new Date(day); next.setDate(day.getDate() + 1);
  return (state.churchEvents || []).filter(ev => ev.start < next && ev.end >= day);
}
function churchTimeText(ev, dateISO){
  if(ev.allDay) return '全天 All day';
  const hm = d => pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  const sISO = formatISODate(ev.start), eISO = formatISODate(ev.end);
  if(sISO === eISO) return to12h(hm(ev.start)) + (ev.end > ev.start ? ' - ' + to12h(hm(ev.end)) : '');
  if(sISO === dateISO) return to12h(hm(ev.start)) + ' 起 from';
  if(eISO === dateISO) return '至 until ' + to12h(hm(ev.end));
  return '全天 All day';
}
/* 桌機:月曆格子、週曆日期下方的金色小條 */
function renderChurchChips(dateISO){
  return churchEventsOn(dateISO).map(ev => {
    const tip = escHtml('⛪ ' + ev.title + ' · ' + churchTimeText(ev, dateISO) + (ev.location ? ' · ' + ev.location : ''));
    return `<div class="church-chip" title="${tip}">⛪ ${escHtml(ev.title)}</div>`;
  }).join('');
}
/* 手機:當天清單最上面的金色卡片 */
function renderChurchAgenda(dateISO){
  return churchEventsOn(dateISO).map(ev => `<div class="church-agenda">
    <div class="church-agenda-tag">⛪ 教會活動<span>Church event</span></div>
    <div class="church-agenda-main"><b>${escHtml(ev.title)}</b><div>${escHtml(churchTimeText(ev, dateISO))}${ev.location ? ' · ' + escHtml(ev.location) : ''}</div></div>
  </div>`).join('');
}

const bookingsAPI = {
  async loadAll(){
    if(sb){
      const { data, error } = await sb.from('bookings').select('*').order('date', {ascending:true}).order('start_time', {ascending:true});
      if(error) throw error;
      return data.map(r => ({
        id: r.id, room: r.room, date: r.date, start: r.start_time, end: r.end_time,
        purpose: r.purpose, name: r.user_name, email: r.user_email, recurringId: r.recurring_id || null,
        status: r.status || 'approved'
      }));
    }
    const list = await storageAdapter.list('booking:', true);
    if(!list || !list.keys || list.keys.length === 0) return [];
    const results = [];
    for(const k of list.keys){
      try{
        const r = await storageAdapter.get(k, true);
        if(r && r.value) results.push(JSON.parse(r.value));
      }catch(e){}
    }
    results.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
    return results;
  },
  async create(record){
    if(sb){
      const { error } = await sb.from('bookings').insert([{
        room: record.room, date: record.date, start_time: record.start, end_time: record.end,
        purpose: record.purpose, user_name: record.name, user_email: record.email,
        recurring_id: record.recurringId || null, status: record.status || 'pending'
      }]);
      if(error) throw error;
      return true;
    }
    const id = 'booking:' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
    const res = await storageAdapter.set(id, JSON.stringify({...record, id}), true);
    if(!res) throw new Error('save failed');
    return true;
  },
  async createMany(records){
    if(sb){
      const rows = records.map(r => ({
        room: r.room, date: r.date, start_time: r.start, end_time: r.end,
        purpose: r.purpose, user_name: r.name, user_email: r.email,
        recurring_id: r.recurringId || null, status: r.status || 'pending'
      }));
      const { error } = await sb.from('bookings').insert(rows);
      if(error) throw error;
      return true;
    }
    for(const r of records){
      const id = 'booking:' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
      await storageAdapter.set(id, JSON.stringify({...r, id}), true);
    }
    return true;
  },
  async removeSeries(recurringId){
    if(sb){
      const { error } = await sb.from('bookings').delete().eq('recurring_id', recurringId);
      if(error) throw error;
      return true;
    }
    const list = await storageAdapter.list('booking:', true);
    if(!list || !list.keys) return true;
    for(const k of list.keys){
      try{
        const r = await storageAdapter.get(k, true);
        if(r && r.value){
          const rec = JSON.parse(r.value);
          if(rec.recurringId === recurringId) await storageAdapter.delete(k, true);
        }
      }catch(e){}
    }
    return true;
  },
  async remove(id){
    if(sb){
      const { error } = await sb.from('bookings').delete().eq('id', id);
      if(error) throw error;
      return true;
    }
    await storageAdapter.delete(id, true);
    return true;
  },
  async update(id, changes){
    if(sb){
      const payload = {};
      if(changes.room !== undefined) payload.room = changes.room;
      if(changes.date !== undefined) payload.date = changes.date;
      if(changes.start !== undefined) payload.start_time = changes.start;
      if(changes.end !== undefined) payload.end_time = changes.end;
      if(changes.purpose !== undefined) payload.purpose = changes.purpose;
      if(changes.name !== undefined) payload.user_name = changes.name;
      if(changes.status !== undefined) payload.status = changes.status;
      const { error } = await sb.from('bookings').update(payload).eq('id', id);
      if(error) throw error;
      return true;
    }
    const existing = await storageAdapter.get(id, true);
    if(!existing || !existing.value) throw new Error('booking not found');
    const rec = JSON.parse(existing.value);
    const updated = {...rec, ...changes};
    const res = await storageAdapter.set(id, JSON.stringify(updated), true);
    if(!res) throw new Error('update failed');
    return true;
  }
};

function overlaps(aStart, aEnd, bStart, bEnd){
  return aStart < bEnd && bStart < aEnd;
}

async function handleSubmit(e){
  e.preventDefault();
  const form = e.target;
  const room = state.selectedRoom;
  const bookerName = form.elements.namedItem('booker_name').value.trim();
  const date = form.elements.namedItem('date').value;
  const start = form.elements.namedItem('start').value;
  const end = form.elements.namedItem('end').value;
  const purpose = form.elements.namedItem('purpose').value.trim();

  state.formMsg = {text:'', type:''};

  if(ADMIN_ONLY_ROOMS.includes(room) && !state.isAdmin){
    state.formMsg = {text:'此空間僅限管理者預約。 This space can only be booked by an admin.', type:'bad'};
    render(); return;
  }

  if(!bookerName || !date || !start || !end || !purpose){
    state.formMsg = {text:'請完整填寫預約人姓名、日期、時間與預約內容。 Please fill in the booker name, date, time, and purpose.', type:'bad'};
    render(); return;
  }
  if(start >= end){
    state.formMsg = {text:'結束時間必須晚於開始時間。 End time must be after start time.', type:'bad'};
    render(); return;
  }

  const conflict = state.bookings.find(b =>
    b.room === room && b.date === date && overlaps(start, end, b.start, b.end)
  );
  if(conflict){
    state.formMsg = {text:`此時段 ${room} 已被 ${conflict.name} 預約（${to12h(conflict.start)}-${to12h(conflict.end)}），請選擇其他時間。 This time slot is already booked by ${conflict.name}.`, type:'bad'};
    render(); return;
  }

  const status = state.isAdmin ? 'approved' : 'pending';
  const record = {
    room, date, start, end, purpose,
    name: bookerName, email: state.user.email, status
  };

  try{
    await bookingsAPI.create(record);
    state.formMsg = state.isAdmin
      ? {text:'預約成功！Booking confirmed!', type:'ok'}
      : {text:'預約已送出，待管理員審核後才算正式確認。 Booking submitted — pending admin approval.', type:'ok'};
    await loadBookings();
    form.elements.namedItem('purpose').value = '';
    sendBookingNotification(record);
  }catch(err){
    state.formMsg = {text:'儲存發生錯誤，請再試一次。 Something went wrong, please try again.', type:'bad'};
    render();
  }
}

    await loadBookings();
  }catch(e){
    alert('取消失敗，請稍後再試一次。\nCancel failed, please try again.');

async function handleApprove(id){

  const booking = state.bookings.find(b => b.id === id);

    state.editMsg = {text:'此空間僅限管理者預約。 This space can only be booked by an admin.', type:'bad'};
    render(); return;
  }

  if(!bookerName || !date || !start || !end || !purpose){
    state.editMsg = {text:'請完整填寫預約人姓名、日期、時間與預約內容。 Please fill in the booker name, date, time, and purpose.', type:'bad'};
    render(); return;
  }
  if(start >= end){
    state.editMsg = {text:'結束時間必須晚於開始時間。 End time must be after start time.', type:'bad'};
    render(); return;
  }
  const conflict = state.bookings.find(b =>
    b.id !== id && b.room === room && b.date === date && overlaps(start, end, b.start, b.end)
  );
  if(conflict){
    state.editMsg = {text:`此時段 ${room} 已被 ${conflict.name} 預約（${to12h(conflict.start)}-${to12h(conflict.end)}），請選擇其他時間。 This time slot is already booked by ${conflict.name}.`, type:'bad'};
    render(); return;
  }

  try{
    await bookingsAPI.update(id, {room, date, start, end, purpose, name: bookerName});
    state.editingBookingId = null;
    await loadBookings();
  }catch(err){
    state.editMsg = {text:'更新時發生錯誤，請再試一次。 Something went wrong, please try again.', type:'bad'};
    render();
  }
}

async function handleRecurringSubmit(e){
  e.preventDefault();
  const form = e.target;
  const room = form.elements.namedItem('room').value;
  const bookerName = form.elements.namedItem('booker_name').value.trim();
  const purpose = form.elements.namedItem('purpose').value.trim();
  const start = form.elements.namedItem('start').value;
  const end = form.elements.namedItem('end').value;
  const startDate = form.elements.namedItem('start_date').value;
  const endMode = form.elements.namedItem('end_mode').value; // 'date' or 'weeks'
  const endDate = form.elements.namedItem('end_date').value;
  const weeksCount = parseInt(form.elements.namedItem('weeks_count').value, 10);
  const dayCheckboxes = [...form.querySelectorAll('input[name="days_of_week"]:checked')].map(cb => parseInt(cb.value, 10));

  state.recurringMsg = {text:'', type:''};

  if(!bookerName || !purpose || !start || !end || !startDate || dayCheckboxes.length === 0){
    state.recurringMsg = {text:'請完整填寫預約人姓名、用途、時間、開始日期，並至少選一個星期幾。 Please fill in booker name, purpose, time, start date, and select at least one day of week.', type:'bad'};
    render(); return;
  }
  if(start >= end){
    state.recurringMsg = {text:'結束時間必須晚於開始時間。 End time must be after start time.', type:'bad'};
    render(); return;
  }

  let effectiveEndDate;
  if(endMode === 'weeks'){
    if(!weeksCount || weeksCount < 1){
      state.recurringMsg = {text:'請輸入有效的重複週數。 Please enter a valid number of weeks.', type:'bad'};
      render(); return;
    }
    const d = parseISODate(startDate);
    d.setDate(d.getDate() + weeksCount * 7 - 1);
    effectiveEndDate = formatISODate(d);
  } else {
    if(!endDate){
      state.recurringMsg = {text:'請選擇結束日期。 Please choose an end date.', type:'bad'};
      render(); return;
    }
    effectiveEndDate = endDate;
  }
  if(effectiveEndDate < startDate){
    state.recurringMsg = {text:'結束日期必須晚於開始日期。 End date must be after start date.', type:'bad'};
    render(); return;
  }

  const dates = recurringDates(startDate, effectiveEndDate, dayCheckboxes);
  if(dates.length === 0){
    state.recurringMsg = {text:'找不到符合條件的日期，請確認星期幾與日期範圍。 No matching dates found — check the days of week and date range.', type:'bad'};
    render(); return;
  }

  const recurringId = 'rec-' + Date.now() + '-' + Math.random().toString(36).slice(2,8);
  const skipped = [];
  const toCreate = [];
  for(const date of dates){
    const conflict = state.bookings.find(b => b.room === room && b.date === date && overlaps(start, end, b.start, b.end))
      || toCreate.find(b => b.room === room && b.date === date && overlaps(start, end, b.start, b.end));
    if(conflict){
      skipped.push(date);
    } else {
      toCreate.push({room, date, start, end, purpose, name: bookerName, email: state.user.email, recurringId, status: 'approved'});
    }
  }

  try{
    if(toCreate.length > 0){
      await bookingsAPI.createMany(toCreate);
    }
    await loadBookings();
    const skippedNote = skipped.length > 0
      ? ` 有 ${skipped.length} 筆因時段衝突被略過（${skipped.join('、')}）。 ${skipped.length} date(s) skipped due to conflicts.`
      : '';
    state.recurringMsg = {text:`已建立 ${toCreate.length} 筆重複預約！Created ${toCreate.length} recurring bookings!${skippedNote}`, type: toCreate.length > 0 ? 'ok' : 'bad'};
    if(toCreate.length > 0){
      render();
    } else {
      render();
    }
  }catch(err){
    state.recurringMsg = {text:'建立重複預約時發生錯誤，請再試一次。 Something went wrong creating the recurring bookings, please try again.', type:'bad'};
    render();
  }
}

async function handleCancelSeries(recurringId){
  if(!confirm('確定要取消整個系列的所有預約嗎？此動作無法復原。 Cancel the entire recurring series? This cannot be undone.')) return;
  try{
    await bookingsAPI.removeSeries(recurringId);
    if(state.selectedEventId){
      const stillExists = state.bookings.find(b => b.id === state.selectedEventId);
      if(!stillExists || stillExists.recurringId === recurringId) state.selectedEventId = null;
    }
    await loadBookings();
  }catch(e){
    alert('取消整個系列失敗，請稍後再試一次。\nCancelling the series failed, please try again.');
  }
}

function renderMapSVG(){
  const floor = FLOORS[state.currentFloor];
  const shapes = floor.shapes.map(s => {
    const isActive = s.name === state.selectedRoom;
    const isLocked = ADMIN_ONLY_ROOMS.includes(s.name) && !state.isAdmin;
    let shapeEl;
    if(s.type === 'octagon'){
      shapeEl = `<polygon class="room-shape ${isActive?'active':''} ${isLocked?'locked':''}" data-room="${s.name}" data-locked="${isLocked}" points="${octagonPoints(s.x,s.y,s.w,s.h,s.cut)}"/>`;
    } else {
      shapeEl = `<rect class="room-shape ${isActive?'active':''} ${isLocked?'locked':''}" data-room="${s.name}" data-locked="${isLocked}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="4"/>`;
    }
    const cx = s.x + s.w/2;
    const cy = s.y + s.h/2 + (s.sub ? -4 : 4);
    const labelText = isLocked ? `🔒 ${s.label}` : s.label;
    const labelEl = `<text class="room-label ${isActive?'active':''}" x="${cx}" y="${cy}">${labelText}</text>`;
    const subEl = s.sub ? `<text class="room-label sub ${isActive?'active':''}" x="${cx}" y="${cy+14}">${s.sub}</text>` : '';
    return shapeEl + labelEl + subEl;
  }).join('');

  return `<svg viewBox="${floor.viewBox}" xmlns="http://www.w3.org/2000/svg">${shapes}</svg>`;
}

  const dayEvents = eventsOnDay(picked);
  const listHtml = `<div class="agenda-day">
    <div class="agenda-day-title ${picked===todayISO?'today':''}"><span>${pd.getMonth()+1}/${pd.getDate()}（${dowFull[pd.getDay()]}）</span>${picked===todayISO?'<small>今天 Today</small>':''}</div>
    ${renderChurchAgenda(picked)}
    ${dayEvents.length ? dayEvents.map(renderAgendaItem).join('') : '<div class="agenda-empty">這天沒有預約 No bookings this day</div>'}
  </div>`;

  return {
    rangeLabel: monthsFull[month] + ' ' + year,
    html: `<div class="m-cal-grid">${dow.map(x => `<div class="m-cal-head">${x}</div>`).join('')}${cells}</div>${listHtml}`
  };
}

/* Mobile week view: a vertical agenda, one section per day. */
function renderWeekAgendaMobile(days){
  const todayISO = formatISODate(new Date());
  const dowNames = ['一 Mon','二 Tue','三 Wed','四 Thu','五 Fri','六 Sat','日 Sun'];
  return days.map((iso, i) => {
    const d = parseISODate(iso);
    const evs = eventsOnDay(iso);
    return `<div class="agenda-day">
      <div class="agenda-day-title ${iso===todayISO?'today':''}"><span>${d.getMonth()+1}/${d.getDate()}（${dowNames[i]}）</span>${iso===todayISO?'<small>今天 Today</small>':''}</div>
      ${renderChurchAgenda(iso)}
      ${evs.length ? evs.map(renderAgendaItem).join('') : '<div class="agenda-empty">沒有預約 No bookings</div>'}
    </div>`;
  }).join('');
}

function renderMonthGrid(){
  if(!state.calMonthStart) state.calMonthStart = formatISODate(new Date());
  const monthDate = parseISODate(state.calMonthStart);
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const todayISO = formatISODate(new Date());
  const monthsFull = ['1月 January','2月 February','3月 March','4月 April','5月 May','6月 June','7月 July','8月 August','9月 September','10月 October','11月 November','12月 December'];
  const dowNames = ['一 Mon','二 Tue','三 Wed','四 Thu','五 Fri','六 Sat','日 Sun'];

  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() === 0 ? 6 : firstOfMonth.getDay() - 1); // days before month start (Mon-first week)
  const gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - startOffset);

  const totalCells = 42; // 6 weeks always, keeps grid height consistent
  const cells = [];
  for(let i=0; i<totalCells; i++){
    const d = new Date(gridStart);
    d.setDate(d.getDate() + i);
    cells.push(d);
  }

  const rangeLabel = monthsFull[month] + ' ' + year;

  const headCells = dowNames.map(dn => `<div class="month-head-cell">${dn}</div>`).join('');

  const dayCells = cells.map(d => {
    const dateISO = formatISODate(d);
    const isOtherMonth = d.getMonth() !== month;
    const isToday = dateISO === todayISO;
    const dayEvents = state.bookings
      .filter(b => b.date === dateISO && (state.calRoomFilter==='all' || b.room === state.calRoomFilter))
      .sort((a,b) => toMinutes(a.start) - toMinutes(b.start));

    const MAX_VISIBLE = 3;
    const visibleEvents = dayEvents.slice(0, MAX_VISIBLE);
    const extraCount = dayEvents.length - visibleEvents.length;

    const pills = visibleEvents.map(ev => {
      const dotColor = state.calRoomFilter==='all' ? colorForRoom(ev.room) : 'var(--ink-navy)';
      const isPending = ev.status === 'pending';
      const titleText = (isPending ? '⏳ ' : '') + (state.calRoomFilter==='all' ? ev.room : ev.name);
      const titleAttr = `${ev.room} · ${to12h(ev.start)}-${to12h(ev.end)} · ${ev.name} · ${ev.purpose}`.replace(/"/g,'&quot;');
      return `<div class="month-event-row" data-event-id="${ev.id}" title="${titleAttr}" style="${isPending?'opacity:0.65;':''}">
        <span class="month-event-dot" style="background:${dotColor};"></span>
        <span class="month-event-time">${to12h(ev.start)}</span>
        <span class="month-event-title">${titleText}</span>
      </div>`;
    }).join('');
    const moreLink = extraCount > 0 ? `<span class="month-more-link" data-goto-day="${dateISO}">還有 ${extraCount} 筆 ${extraCount} more</span>` : '';

    return `<div class="month-day-cell ${isOtherMonth?'other-month':''} ${isToday?'today':''}">
      <div class="month-day-num" data-goto-day="${dateISO}">${d.getDate()}</div>
      ${renderChurchChips(dateISO)}
      ${pills}
      ${moreLink}
    </div>`;
  }).join('');

  return { rangeLabel, html: `
    <div class="month-scroll">
      <div class="month-grid">
        ${headCells}
        ${dayCells}
      </div>
    </div>
  `};
}

    <div style="font-size:14.5px;margin-top:8px;">預約人 Booked by：${selected.name}</div>
    <div style="font-size:14.5px;margin-top:5px;line-height:1.5;">${selected.purpose}</div>
    ${canManageSelected ? `<div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;">

        <button class="b-cancel" style="color:var(--forest);" data-approve="${selected.id}">核准 Approve</button>
        <button class="b-cancel" data-reject="${selected.id}">拒絕 Reject</button>
        <button class="b-cancel" style="color:var(--slate-blue);" data-edit="${selected.id}">編輯 Edit</button>
      ` : `
        <button class="b-cancel" data-cancel="${selected.id}">取消預約 Cancel</button>
        <button class="b-cancel" style="color:var(--slate-blue);" data-edit="${selected.id}">編輯 Edit</button>
        ${selected.recurringId ? `<button class="b-cancel" data-cancel-series="${selected.recurringId}">取消整個系列 Cancel series</button>` : ''}
      `}
    </div>` : ''}
    `}
  </div>` : '';

  const modeTabs = `
    <div class="cal-mode-tabs">
      <button class="cal-mode-tab ${state.calViewMode==='week'?'active':''}" data-cal-mode="week">週 Week</button>
      <button class="cal-mode-tab ${state.calViewMode==='month'?'active':''}" data-cal-mode="month">月 Month</button>
    </div>`;

  let gridSection;
  if(state.calViewMode === 'month'){
    const month = isMobile() ? renderMonthGridMobile() : renderMonthGrid();
    gridSection = `
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="cal-prev">‹</button>
          <div class="cal-range">${month.rangeLabel}</div>
          <button id="cal-next">›</button>
          <button class="cal-today-btn" id="cal-today">本月 Today</button>
        </div>
        ${modeTabs}
      </div>
      <select class="cal-room-select" id="cal-room-filter">${roomFilterOptions}</select>
      ${month.html}
    `;
  } else {
    const days = weekDates(state.calWeekStart);
    const todayISO = formatISODate(new Date());
    const dowNames = ['一 Mon','二 Tue','三 Wed','四 Thu','五 Fri','六 Sat','日 Sun'];
    const monthsShort = ['1月 Jan','2月 Feb','3月 Mar','4月 Apr','5月 May','6月 Jun','7月 Jul','8月 Aug','9月 Sep','10月 Oct','11月 Nov','12月 Dec'];

    const firstDate = parseISODate(days[0]);
    const lastDate = parseISODate(days[6]);
    const rangeLabel = firstDate.getMonth() === lastDate.getMonth()
      ? `${monthsShort[firstDate.getMonth()]} ${firstDate.getDate()}–${lastDate.getDate()}`
      : `${monthsShort[firstDate.getMonth()]}${firstDate.getDate()} – ${monthsShort[lastDate.getMonth()]}${lastDate.getDate()}`;

    const SLOT_H = 22;
    const gridHeight = 48 * SLOT_H;

    const timeLabels = [];
    for(let i=0; i<48; i++){
      if(i % 2 !== 0) continue;
      timeLabels.push(`<div class="cal-time-label" style="top:${i*SLOT_H}px">${hourLabel12(Math.floor(i/2))}</div>`);
    }
    const timeLabelsHtml = timeLabels.join('');

    const dayColumns = days.map(dateISO => {
      const dayEvents = state.bookings.filter(b =>
        b.date === dateISO && (state.calRoomFilter==='all' || b.room === state.calRoomFilter)
      );
      const {events, maxLanes} = assignLanes(dayEvents);
      const eventEls = events.map(ev => {
        const startMin = toMinutes(ev.start);
        const endMin = toMinutes(ev.end);
        const top = (startMin/30)*SLOT_H;
        const height = Math.max(((endMin-startMin)/30)*SLOT_H - 2, 14);
        const widthPct = 100/maxLanes;
        const leftPct = ev.lane * widthPct;
        const bg = state.calRoomFilter==='all' ? colorForRoom(ev.room) : 'var(--ink-navy)';
        const isPending = ev.status === 'pending';
        const label = (isPending ? '⏳ ' : '') + (state.calRoomFilter==='all' ? ev.room : ev.name);
        const pendingStyle = isPending ? 'opacity:0.6;border-style:dashed;border-width:2px;' : '';
        const titleAttr = `${ev.room} · ${to12h(ev.start)}-${to12h(ev.end)} · ${ev.name} · ${ev.purpose}${isPending ? ' · 待審核 Pending' : ''}`.replace(/"/g,'&quot;');
        return `<div class="cal-event" data-event-id="${ev.id}" title="${titleAttr}"
          style="top:${top}px;height:${height}px;left:calc(${leftPct}% + 2px);width:calc(${widthPct}% - 4px);background:${bg};${pendingStyle}">
          <b>${label}</b>${to12h(ev.start)}-${to12h(ev.end)}
        </div>`;
      }).join('');
      const isToday = dateISO === todayISO;
      return `<div class="cal-day-col ${isToday?'today':''}" style="height:${gridHeight}px" data-day="${dateISO}">${eventEls}</div>`;
    }).join('');

    const headCells = days.map((dateISO,i) => {
      const d = parseISODate(dateISO);
      const isToday = dateISO === todayISO;
      return `<div class="cal-head-cell ${isToday?'today':''}">
        <div class="dow">${dowNames[i]}</div>
        <div>${d.getMonth()+1}/${d.getDate()}</div>
        ${renderChurchChips(dateISO)}
      </div>`;
    }).join('');

    gridSection = `
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="cal-prev">‹</button>
          <div class="cal-range">${rangeLabel}</div>
          <button id="cal-next">›</button>
          <button class="cal-today-btn" id="cal-today">本週 Today</button>
        </div>
        ${modeTabs}
      </div>
      <select class="cal-room-select" id="cal-room-filter">${roomFilterOptions}</select>

      ${isMobile() ? renderWeekAgendaMobile(days) : `<div class="cal-scroll" id="cal-scroll">
        <div class="cal-grid">
          <div class="cal-corner"></div>
          ${headCells}
          <div class="cal-time-col" style="height:${gridHeight}px">${timeLabelsHtml}</div>
          ${dayColumns}
        </div>
      </div>`}
    `;
  }

  return `
    <div class="panel">
      <h2>空間預約行事曆 Booking Calendar</h2>
      ${isMobile() ? '' : `<p class="desc">類似 Google 日曆的檢視，可切換週/月檢視，也可切換看全部空間或單一空間。<br>A Google Calendar-style view — switch between week/month, and all rooms or a single room.</p>`}

      ${gridSection}

      ${legend}
      ${detail && isMobile() ? '<div class="sheet-backdrop" id="cal-sheet-backdrop"></div>' : ''}
      ${detail}
    </div>
  `;
}

function renderApp(){
  const wrap = document.getElementById('app');

  const floorTabs = Object.keys(FLOORS).map(k => `

  const filterChips = ['all', ...ROOMS].map(r => `

  `).join('');

  const today = new Date().toISOString().slice(0,10);
  const visible = state.bookings.filter(b =>
    (state.filterRoom==='all' || b.room===state.filterRoom) &&
    b.date >= today &&
    (!state.showPendingOnly || b.status === 'pending')
  );

  function renderBookingRow(b, opts){
    opts = opts || {};
    if(state.editingBookingId === b.id){
      return `<div class="booking-item">${renderEditForm(b)}</div>`;
    }
    const md = fmtMonthDay(b.date);
    const canManage = b.email === state.user.email || state.isAdmin;
    const isPending = b.status === 'pending';
    const statusBadge = isPending ? '<span class="pending-badge">⏳ 待審核 Pending</span>' : '';
    const showSeriesCancelBtn = b.recurringId && !opts.hideSeriesCancel;
    const actionButtons = isPending && state.isAdmin
      ? `<button class="b-cancel" style="color:var(--forest);" data-approve="${b.id}">核准 Approve</button>
         <button class="b-cancel" data-reject="${b.id}">拒絕 Reject</button>
         <button class="b-cancel" style="color:var(--slate-blue);" data-edit="${b.id}">編輯 Edit</button>`
      : `<button class="b-cancel" data-cancel="${b.id}">取消預約 Cancel</button>
         <button class="b-cancel" style="color:var(--slate-blue);" data-edit="${b.id}">編輯 Edit</button>
         ${showSeriesCancelBtn ? `<button class="b-cancel" data-cancel-series="${b.recurringId}">取消整個系列 Cancel series</button>` : ''}`;
    return `<div class="booking-item">
      <div class="b-date"><div class="d">${md.d}</div><div class="m">${md.m}</div></div>
      <div class="b-body">
        <div class="b-top">
          <span class="b-room">${b.room}${b.recurringId ? '<span class="recurring-badge">🔁 重複 Recurring</span>' : ''}${statusBadge}</span>
          <span class="b-time">${to12h(b.start)} - ${to12h(b.end)}</span>
        </div>
        <div class="b-who">預約人 Booked by：${b.name}</div>
        <div class="b-purpose">${b.purpose}</div>
        ${canManage ? `<div style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;">${actionButtons}</div>` : ''}
      </div>
    </div>`;
  }

  /* Group visible bookings so a recurring series appears as one collapsible
     row instead of cluttering the list with every future occurrence. */
  function buildDisplayUnits(list){
    const seriesMap = new Map();
    const singles = [];
    for(const b of list){
      if(b.recurringId){
        if(!seriesMap.has(b.recurringId)) seriesMap.set(b.recurringId, []);
        seriesMap.get(b.recurringId).push(b);
      } else {
        singles.push({type:'single', sortDate: b.date, booking: b});
      }
    }
    const seriesUnits = [...seriesMap.entries()].map(([recurringId, items]) => {
      items.sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
      return {type:'series', sortDate: items[0].date, recurringId, items};
    });
    return [...singles, ...seriesUnits].sort((a,b) => a.sortDate.localeCompare(b.sortDate));
  }

  let bookingListHtml;
  if(state.loading){
    bookingListHtml = `<div class="loading">載入預約紀錄中… Loading bookings…</div>`;
  } else if(visible.length === 0){
    bookingListHtml = `<div class="empty">目前沒有即將到來的預約。 No upcoming bookings.</div>`;
  } else {
    const units = buildDisplayUnits(visible);
    bookingListHtml = units.map(unit => {
      if(unit.type === 'single'){
        return renderBookingRow(unit.booking);
      }
      // Recurring series
      const isExpanded = !!state.expandedSeries[unit.recurringId];
      if(isExpanded){
        const rows = unit.items.map(b => renderBookingRow(b, {hideSeriesCancel: false})).join('');
        return rows + `<div style="padding:8px 4px 4px;"><button class="b-cancel" style="color:var(--slate-blue);" data-collapse-series="${unit.recurringId}">收合 Collapse ▲</button></div>`;
      }
      const first = unit.items[0];
      const md = fmtMonthDay(first.date);
      const canManage = first.email === state.user.email || state.isAdmin;
      return `<div class="booking-item">
        <div class="b-date"><div class="d">${md.d}</div><div class="m">${md.m}</div></div>
        <div class="b-body">
          <div class="b-top">
            <span class="b-room">${first.room}<span class="recurring-badge">🔁 重複 Recurring · 共 ${unit.items.length} 筆 · ${unit.items.length} occurrences</span></span>
            <span class="b-time">${to12h(first.start)} - ${to12h(first.end)}</span>
          </div>
          <div class="b-who">預約人 Booked by：${first.name}</div>
          <div class="b-purpose">${first.purpose}</div>
          <div style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap;">
            <button class="b-cancel" style="color:var(--slate-blue);" data-expand-series="${unit.recurringId}">顯示全部 ${unit.items.length} 筆 Show all ▼</button>
            ${canManage ? `<button class="b-cancel" data-cancel-series="${unit.recurringId}">取消整個系列 Cancel series</button>` : ''}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  wrap.innerHTML = `
  <div class="header">

  ${state.usingFallbackStorage ? `<div class="fallback-banner">⚠️ 目前連不上共用資料庫，系統暫時改用「本次瀏覽暫存」模式：功能都能正常測試，但重新整理頁面或關閉分頁後，這些預約紀錄會消失，且不會被其他會員看到。<br>Can't reach the shared database right now — using a temporary local mode. Everything works for testing, but bookings will disappear on refresh and won't be visible to other members.</div>` : ''}

    <div class="panel">
      <h2>即將到來的預約 Upcoming Bookings</h2>
      ${isMobile() ? '' : `<p class="desc">所有會員皆可查看，避免時段衝突。<br>Visible to all members to help avoid double-booking.</p>`}
      ${state.isAdmin ? `<button class="recurring-toggle-btn" id="pending-only-toggle" style="${state.showPendingOnly ? '' : 'background:#fff;border-color:var(--line);'}">${state.showPendingOnly ? '✓ 只顯示待審核 Showing pending only' : '⏳ 只顯示待審核 Show pending only'}</button>` : ''}
      ${isMobile()
        ? `<select class="filter-select" id="filter-room-select">${['all', ...ROOMS].map(r => `<option value="${r}" ${state.filterRoom===r?'selected':''}>${r==='all'?'全部空間 All Rooms':r}</option>`).join('')}</select>`
        : `<div class="filter-bar">${filterChips}</div>`}
      ${bookingListHtml}
    </div>
  </div>
  `}
  `;

  document.getElementById('signout-btn').addEventListener('click', handleLogout);

  wrap.querySelectorAll('.view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      state.selectedEventId = null;
      render();
    });
  });

  if(state.view === 'calendar'){
    if(state.calViewMode === 'week'){
      const scrollEl = document.getElementById('cal-scroll');
      if(scrollEl) scrollEl.scrollTop = 7 * 2 * 22; // auto-scroll to 07:00
    }

    document.getElementById('cal-prev').addEventListener('click', () => {
      if(state.calViewMode === 'month'){
        const d = parseISODate(state.calMonthStart); d.setMonth(d.getMonth()-1, 1);
        state.calMonthStart = formatISODate(d);
      } else {
        const d = parseISODate(state.calWeekStart); d.setDate(d.getDate()-7);
        state.calWeekStart = formatISODate(d);
      }
      render();
    });
    document.getElementById('cal-next').addEventListener('click', () => {
      if(state.calViewMode === 'month'){
        const d = parseISODate(state.calMonthStart); d.setMonth(d.getMonth()+1, 1);
        state.calMonthStart = formatISODate(d);
      } else {
        const d = parseISODate(state.calWeekStart); d.setDate(d.getDate()+7);
        state.calWeekStart = formatISODate(d);
      }
      render();
    });
    document.getElementById('cal-today').addEventListener('click', () => {
      if(state.calViewMode === 'month'){
        state.calMonthStart = formatISODate(new Date());
        state.calSelectedDay = formatISODate(new Date());
      } else {
        state.calWeekStart = formatISODate(mondayOf(new Date()));
      }
      render();
    });
    document.getElementById('cal-room-filter').addEventListener('change', (e) => {
      state.calRoomFilter = e.target.value; render();
    });
    wrap.querySelectorAll('.cal-mode-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.calViewMode = btn.dataset.calMode;
        state.selectedEventId = null;
        render();
      });
    });
    wrap.querySelectorAll('[data-pick-day]').forEach(el => {
      el.addEventListener('click', () => { state.calSelectedDay = el.dataset.pickDay; state.selectedEventId = null; render(); });
    });
    const sheetBackdrop = document.getElementById('cal-sheet-backdrop');
    if(sheetBackdrop) sheetBackdrop.addEventListener('click', () => { state.selectedEventId = null; state.editingBookingId = null; render(); });
    wrap.querySelectorAll('.cal-event, .month-event-row, .agenda-item').forEach(ev => {
      ev.addEventListener('click', () => {
        state.selectedEventId = ev.dataset.eventId;
        render();
      });
    });
    wrap.querySelectorAll('[data-goto-day]').forEach(el => {
      el.addEventListener('click', () => {
        const dateISO = el.dataset.gotoDay;
        state.calViewMode = 'week';
        state.calWeekStart = formatISODate(mondayOf(parseISODate(dateISO)));
        state.selectedEventId = null;
        render();
      });
    });
    const closeBtn = document.getElementById('cal-detail-close');
    if(closeBtn) closeBtn.addEventListener('click', () => { state.selectedEventId = null; render(); });
  }

  if(state.view === 'booking'){
    wrap.querySelectorAll('.floor-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        state.currentFloor = btn.dataset.floor;
        render();
      });
    });

    const filterSelect = document.getElementById('filter-room-select');
    if(filterSelect) filterSelect.addEventListener('change', (e) => { state.filterRoom = e.target.value; render(); });

    wrap.querySelectorAll('.room-shape, .room-btn').forEach(shape => {
      shape.addEventListener('click', () => {
        if(shape.dataset.locked === 'true'){
          alert('此空間僅限管理者預約，請洽教會辦公室協助安排。\nThis space can only be booked by an admin — please contact the church office for help.');
          return;
        }
        state.selectedRoom = shape.dataset.room;
        render();
      });
    });

    wrap.querySelectorAll('.filter-chip').forEach(c => {
      c.addEventListener('click', () => {
        state.filterRoom = c.dataset.filter;
        render();
      });
    });

    const recurringToggleBtn = document.getElementById('recurring-toggle-btn');
    if(recurringToggleBtn){
      recurringToggleBtn.addEventListener('click', () => {
        if(state.showRecurringForm){ closeRecurringForm(); } else { openRecurringForm(); }
      });
    }

    const bookingForm = document.getElementById('booking-form');
    if(bookingForm) bookingForm.addEventListener('submit', handleSubmit);

    const recurringForm = document.getElementById('recurring-form');
    if(recurringForm) recurringForm.addEventListener('submit', handleRecurringSubmit);

    const cancelRecurringBtn = document.getElementById('cancel-recurring-btn');
    if(cancelRecurringBtn) cancelRecurringBtn.addEventListener('click', closeRecurringForm);

    const pendingOnlyToggle = document.getElementById('pending-only-toggle');
    if(pendingOnlyToggle){
      pendingOnlyToggle.addEventListener('click', () => {
        state.showPendingOnly = !state.showPendingOnly;
        render();
      });
    }
  }

  wrap.querySelectorAll('[data-cancel]').forEach(btn => {
    btn.addEventListener('click', () => {
      const b = state.bookings.find(x => x.id === btn.dataset.cancel);
      if(b) handleCancel(b.id, b.email);
    });
  });

  wrap.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      openEditBooking(btn.dataset.edit);
    });
  });

  wrap.querySelectorAll('[data-cancel-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      closeEditBooking();
    });
  });

  wrap.querySelectorAll('[data-cancel-series]').forEach(btn => {
    btn.addEventListener('click', () => {
      handleCancelSeries(btn.dataset.cancelSeries);
    });
  });

  wrap.querySelectorAll('[data-expand-series]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.expandedSeries[btn.dataset.expandSeries] = true;
      render();
    });
  });

  wrap.querySelectorAll('[data-collapse-series]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.expandedSeries[btn.dataset.collapseSeries] = false;
      render();
    });
  });

  wrap.querySelectorAll('[data-approve]').forEach(btn => {
    btn.addEventListener('click', () => {
      handleApprove(btn.dataset.approve);
    });
  });

  wrap.querySelectorAll('[data-reject]').forEach(btn => {
    btn.addEventListener('click', () => {
      handleReject(btn.dataset.reject);
    });
  });

  wrap.querySelectorAll('.edit-form').forEach(form => {
    form.addEventListener('submit', (e) => handleEditSubmit(e, form.dataset.editId));
  });
}

function render(){
  if(!state.user){
    renderLogin();
  } else {
    renderApp();
  }
}

async function initAuth(){
  if(sb){
    sb.auth.onAuthStateChange((event, session) => {
      if(event === 'SIGNED_IN' && session && session.user){
        setUserFromSession(session);
      } else if(event === 'SIGNED_OUT'){
        state.user = null;
        render();
      }
    });
    const { data: { session } } = await sb.auth.getSession();
    if(session && session.user){
      await setUserFromSession(session);
      return;
    }
  }
  render();
}

const faviconLink = document.createElement('link');
faviconLink.rel = 'icon';
faviconLink.href = CHURCH_LOGO_DATA_URI;
document.head.appendChild(faviconLink);

initAuth();
</script>
</body>
</html>
